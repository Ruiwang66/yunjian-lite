name: cloudease-lite
services:
  server:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    image: cloudease-lite:0.1.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-5050}:8080"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-7}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ALLOW_LEGACY_REPORTS: ${ALLOW_LEGACY_REPORTS:-false}
      TZ: Asia/Shanghai
    volumes:
      - cloudease-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  cloudease-data:
